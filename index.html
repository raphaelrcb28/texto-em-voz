<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Comunicação CAA + Macros por Categoria</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            gap: 15px;
        }

        h1 {
            font-size: 20px;
            color: #333;
            text-align: center;
        }

        /* Container Principal */
        .container-app {
            display: flex;
            width: 100%;
            max-width: 650px;
            gap: 15px;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Barra Lateral de Cores */
        .barra-cores {
            display: flex;
            flex-direction: column;
            width: 35px;
            border: 2px solid #000;
            border-radius: 4px;
            overflow: hidden;
        }

        .bloco-cor {
            flex: 1;
            min-height: 25px;
        }

        .cor-1 { background-color: #d32f2f; }
        .cor-2 { background-color: #f57c00; }
        .cor-3 { background-color: #fbc02d; }
        .cor-4 { background-color: #afb42b; }
        .cor-5 { background-color: #7cb342; }
        .cor-6 { background-color: #388e3c; }
        .cor-7 { background-color: #00acc1; }
        .cor-8 { background-color: #0288d1; }
        .cor-9 { background-color: #7b1fa2; }
        .cor-10 { background-color: #f06292; }
        .cor-11 { background-color: #b39ddb; }
        .cor-12 { background-color: #757575; }
        .cor-13 { background-color: #5d4037; }

        /* Área do Conteúdo Principal */
        .area-conteudo {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .linha-nivel {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
            background-color: #f0f4f8;
            border-radius: 8px;
            align-items: center;
        }

        .label-nivel {
            width: 100%;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-bottom: 2px;
        }

        .btn-opcao {
            padding: 10px 14px;
            font-size: 15px;
            font-weight: bold;
            color: #c62828;
            background-color: #ffffff;
            border: 2px solid #c62828;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-opcao:hover {
            background-color: #ffebee;
        }

        /* Seção de Configuração do Macro com 5 Caixas */
        .secao-macro-config {
            width: 100%;
            max-width: 650px;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-categoria-nome {
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #7b1fa2;
            border-radius: 6px;
            outline: none;
            width: 100%;
            color: #4a148c;
        }

        .grid-5-caixas {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .caixa-frase-item {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .caixa-frase-item span {
            font-weight: bold;
            font-size: 14px;
            color: #666;
            width: 20px;
        }

        .caixa-frase-item input {
            flex: 1;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        .btn-salvar-macro {
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 5px;
        }

        /* Rodapé Fixo */
        .acoes-rodape {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            max-width: 650px;
            justify-content: space-between;
        }

        .btn-rodape {
            padding: 15px 10px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            flex: 1;
            min-width: 80px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .btn-sim { background-color: #2e7d32; }
        .btn-nao { background-color: #c62828; }
        .btn-escrever { background-color: #0277bd; }
        .btn-falar { background-color: #6a1b9a; flex: 1.5; }

        .caixa-escrita {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 650px;
        }

        input[type="text"].campo-escrita {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .btn-enviar {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            background-color: #f57c00;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Prancha de Comunicação CAA + Macros Categorizados</h1>

    <div class="container-app">
        <!-- Barra de Cores Lateral -->
        <div class="barra-cores">
            <div class="bloco-cor cor-1"></div>
            <div class="bloco-cor cor-2"></div>
            <div class="bloco-cor cor-3"></div>
            <div class="bloco-cor cor-4"></div>
            <div class="bloco-cor cor-5"></div>
            <div class="bloco-cor cor-6"></div>
            <div class="bloco-cor cor-7"></div>
            <div class="bloco-cor cor-8"></div>
            <div class="bloco-cor cor-9"></div>
            <div class="bloco-cor cor-10"></div>
            <div class="bloco-cor cor-11"></div>
            <div class="bloco-cor cor-12"></div>
            <div class="bloco-cor cor-13"></div>
        </div>

        <div class="area-conteudo">
            
            <!-- Nível 1 - Categorias Padrão e Macros -->
            <div class="linha-nivel">
                <span class="label-nivel">Nível 1 - Categorias</span>
                <button class="btn-opcao" onclick="selecionarNivel1('Comida')">Comida</button>
                <button class="btn-opcao" onclick="selecionarNivel1('Dor')">Dor</button>
                <button class="btn-opcao" onclick="selecionarNivel1('Banheiro')">Banheiro</button>
                <button class="btn-opcao" onclick="selecionarNivel1('Cumprimento')">Cumprimento</button>
                <button class="btn-opcao" onclick="selecionarNivel1('Resposta')">Resposta</button>
                <!-- Categorias de Macros Personalizadas são inseridas aqui -->
                <div id="container-macros-nivel1" style="display: inline-flex; gap: 8px; flex-wrap: wrap;"></div>
            </div>

            <!-- Nível 2 - Sub-frases -->
            <div class="linha-nivel" id="nivel2" style="display: none;">
                <span class="label-nivel" id="label-nivel2">Nível 2 - Opções</span>
                <div id="conteudo-nivel2" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
            </div>

            <!-- Nível 3 -->
            <div class="linha-nivel" id="nivel3" style="display: none;">
                <span class="label-nivel">Nível 3 - Tipo</span>
                <div id="conteudo-nivel3" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
            </div>

            <!-- Nível 4 -->
            <div class="linha-nivel" id="nivel4" style="display: none;">
                <span class="label-nivel">Nível 4 - Variedade</span>
                <div id="conteudo-nivel4" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
            </div>

        </div>
    </div>

    <!-- Seção de Cadastro de Macro com 5 Caixas -->
    <div class="secao-macro-config">
        <span class="label-nivel" style="font-size: 14px; color: #4a148c;">Criar/Editar Macro (Ex: "Mãe")</span>
        <input type="text" id="nomeMacroGrupo" class="input-categoria-nome" placeholder="Nome do Macro (ex: Mãe, Remédios, Ajudante)">

        <span class="label-nivel">Digite até 5 falas para esse Macro:</span>
        <div class="grid-5-caixas">
            <div class="caixa-frase-item"><span>1.</span><input type="text" id="frase1" placeholder="Fala 1 (ex: Mãe, vem cá)"></div>
            <div class="caixa-frase-item"><span>2.</span><input type="text" id="frase2" placeholder="Fala 2 (ex: Mãe, estou com fome)"></div>
            <div class="caixa-frase-item"><span>3.</span><input type="text" id="frase3" placeholder="Fala 3 (ex: Mãe, me ajuda aqui)"></div>
            <div class="caixa-frase-item"><span>4.</span><input type="text" id="frase4" placeholder="Fala 4 (ex: Mãe, me dá água)"></div>
            <div class="caixa-frase-item"><span>5.</span><input type="text" id="frase5" placeholder="Fala 5 (ex: Te amo, mãe)"></div>
        </div>

        <button class="btn-salvar-macro" onclick="salvarMacroGrupo()">Salvar Macro</button>
    </div>

    <!-- Botões Fixos de Ação -->
    <div class="acoes-rodape">
        <button class="btn-rodape btn-sim" onclick="falar('SIM')">SIM</button>
        <button class="btn-rodape btn-nao" onclick="falar('NÃO')">NÃO</button>
        <button class="btn-rodape btn-escrever" onclick="focarEscrita()">Escrever</button>
        <button class="btn-rodape btn-falar" onclick="falar('Quero falar com você')">Quero falar com você</button>
    </div>

    <!-- Caixa para Digitar e Falar Momentâneo -->
    <div class="caixa-escrita">
        <input type="text" id="campoTexto" class="campo-escrita" placeholder="Digite para falar algo momentâneo..." onkeydown="checarEnter(event)">
        <button class="btn-enviar" onclick="enviarTexto()">Falar</button>
    </div>

    <script>
        function falar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'pt-BR';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        /* Salvar Macro com Nome de Categoria e até 5 frases */
        function salvarMacroGrupo() {
            const nomeGrupo = document.getElementById('nomeMacroGrupo').value.trim();
            if (!nomeGrupo) {
                alert('Por favor, digite o nome do Macro (ex: Mãe).');
                return;
            }

            const frases = [];
            for (let i = 1; i <= 5; i++) {
                const valor = document.getElementById(`frase${i}`).value.trim();
                if (valor !== '') {
                    frases.push(valor);
                }
            }

            if (frases.length === 0) {
                alert('Preencha pelo menos uma fala para o macro.');
                return;
            }

            const grupos = JSON.parse(localStorage.getItem('caa_macro_grupos') || '{}');
            grupos[nomeGrupo] = frases;
            localStorage.setItem('caa_macro_grupos', JSON.stringify(grupos));

            // Limpa formulário
            document.getElementById('nomeMacroGrupo').value = '';
            for (let i = 1; i <= 5; i++) {
                document.getElementById(`frase${i}`).value = '';
            }

            carregarMacrosTela();
        }

        /* Renderizar Macros Criados no Nível 1 */
        function carregarMacrosTela() {
            const container = document.getElementById('container-macros-nivel1');
            container.innerHTML = '';

            const grupos = JSON.parse(localStorage.getItem('caa_macro_grupos') || '{}');

            for (const nomeGrupo in grupos) {
                const btn = document.createElement('button');
                btn.className = 'btn-opcao';
                btn.style.borderColor = '#7b1fa2';
                btn.style.color = '#7b1fa2';
                btn.textContent = nomeGrupo;
                btn.onclick = () => abrirMacroGrupo(nomeGrupo, grupos[nomeGrupo]);
                container.appendChild(btn);
            }
        }

        /* Abrir o Nível 2 com as 5 caixas/falas do Macro selecionado */
        function abrirMacroGrupo(nomeGrupo, frases) {
            falar(nomeGrupo);

            const n2 = document.getElementById('nivel2');
            const c2 = document.getElementById('conteudo-nivel2');
            const labelN2 = document.getElementById('label-nivel2');

            document.getElementById('nivel3').style.display = 'none';
            document.getElementById('nivel4').style.display = 'none';

            labelN2.textContent = `Opções de "${nomeGrupo}"`;
            c2.innerHTML = '';

            frases.forEach(frase => {
                const btn = document.createElement('button');
                btn.className = 'btn-opcao';
                btn.style.borderColor = '#4a148c';
                btn.style.color = '#4a148c';
                btn.textContent = frase;
                btn.onclick = () => falar(frase);
                c2.appendChild(btn);
            });

            n2.style.display = 'flex';
        }

        /* Seleção Padrão das Categorias do Sistema */
        function selecionarNivel1(opcao) {
            falar(opcao);
            
            const n2 = document.getElementById('nivel2');
            const c2 = document.getElementById('conteudo-nivel2');
            const labelN2 = document.getElementById('label-nivel2');

            document.getElementById('nivel3').style.display = 'none';
            document.getElementById('nivel4').style.display = 'none';

            labelN2.textContent = 'Nível 2 - Opções';
            c2.innerHTML = '';

            if (opcao === 'Comida') {
                c2.innerHTML = `
                    <button class="btn-opcao" onclick="falar('Água')">Água</button>
                    <button class="btn-opcao" onclick="selecionarNivel3Biscoito()">Biscoito</button>
                    <button class="btn-opcao" onclick="falar('Pão')">Pão</button>
                    <button class="btn-opcao" onclick="falar('Lanche')">Lanche</button>
                `;
                n2.style.display = 'flex';
            } else if (opcao === 'Cumprimento') {
                c2.innerHTML = `
                    <button class="btn-opcao" onclick="falar('Bom dia')">Bom dia</button>
                    <button class="btn-opcao" onclick="falar('Boa tarde')">Boa tarde</button>
                    <button class="btn-opcao" onclick="falar('Boa noite')">Boa noite</button>
                `;
                n2.style.display = 'flex';
            } else if (opcao === 'Resposta') {
                c2.innerHTML = `
                    <button class="btn-opcao" onclick="falar('Como você está?')">Como você está?</button>
                    <button class="btn-opcao" onclick="falar('Estou bem, Graças a Deus')">Estou bem, Graças a Deus</button>
                `;
                n2.style.display = 'flex';
            } else {
                n2.style.display = 'none';
            }
        }

        function selecionarNivel3Biscoito() {
            falar('Biscoito');
            const n3 = document.getElementById('nivel3');
            const c3 = document.getElementById('conteudo-nivel3');
            document.getElementById('nivel4').style.display = 'none';

            c3.innerHTML = `
                <button class="btn-opcao" onclick="selecionarNivel4Doce()">Doce</button>
                <button class="btn-opcao" onclick="falar('Biscoito Salgado')">Salgado</button>
            `;
            n3.style.display = 'flex';
        }

        function selecionarNivel4Doce() {
            falar('Doce');
            const n4 = document.getElementById('nivel4');
            const c4 = document.getElementById('conteudo-nivel4');

            c4.innerHTML = `
                <button class="btn-opcao" onclick="falar('Biscoito doce recheado')">Recheado</button>
                <button class="btn-opcao" onclick="falar('Biscoito doce simples')">Simples</button>
            `;
            n4.style.display = 'flex';
        }

        function focarEscrita() {
            falar('Escrever');
            document.getElementById('campoTexto').focus();
        }

        function enviarTexto() {
            const campo = document.getElementById('campoTexto');
            if (campo.value.trim() !== '') {
                falar(campo.value);
                campo.value = '';
            }
        }

        function checarEnter(event) {
            if (event.key === 'Enter') {
                enviarTexto();
            }
        }

        // Inicializa ao carregar a página
        carregarMacrosTela();
    </script>
</body>
</html>
